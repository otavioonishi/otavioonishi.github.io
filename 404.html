<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página não encontrada — Otávio Onishi</title>
  <meta name="description" content="A página que você procura não existe ou foi movida." />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#090D12" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* Página 404 independente: CSS próprio, sem depender do restante do site. */
    :root {
      --bg: #090D12;
      --card: #111820;
      --border: #1E2833;
      --text: #E8EEF5;
      --muted: #98A6B5;
      --accent: #A3FF5F;
      --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-display: "Manrope", var(--font);
      --font-mono: "JetBrains Mono", ui-monospace, "Courier New", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(163, 255, 95, .07), transparent 65%),
        var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { width: 100%; max-width: 620px; text-align: center; }
    .eyebrow {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 12.5px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 18px;
    }
    .code {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(88px, 24vw, 150px);
      line-height: .9;
      letter-spacing: -.05em;
      color: transparent;
      -webkit-text-stroke: 1.5px var(--border);
      margin-bottom: 26px;
      user-select: none;
    }
    h1 {
      font-family: var(--font-display);
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 800;
      letter-spacing: -.02em;
      margin-bottom: 14px;
    }
    h1 span { color: var(--accent); }
    p { color: var(--muted); font-size: 15.5px; max-width: 46ch; margin: 0 auto 30px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 24px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-family: var(--font);
      font-size: 14.5px;
      font-weight: 600;
      text-decoration: none;
      transition: border-color .25s ease, color .25s ease, background-color .25s ease, transform .25s ease;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #08120A; }
    .btn-primary:hover { background: #B6FF7E; border-color: #B6FF7E; color: #08120A; }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .foot { margin-top: 42px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
    .foot a { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
    .foot a:hover { color: var(--accent); }
    @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
  </style>
</head>
<body>
  <main class="wrap">
    <span class="eyebrow">// erro 404</span>
    <div class="code" aria-hidden="true">404</div>
    <h1>Página <span>não encontrada.</span></h1>
    <p>O endereço acessado não existe, foi movido ou está com a grafia incorreta. Volte ao início para continuar navegando.</p>
    <div class="actions">
      <a class="btn btn-primary" href="./index.html">Voltar ao início</a>
      <a class="btn" href="./index.html#contato">Falar comigo</a>
    </div>
    <p class="foot">Otávio Onishi — Desenvolvedor de Sistemas</p>
  </main>
</body>
</html>
